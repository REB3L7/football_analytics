name: Football Analytics CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  database-tests:
    name: PostgreSQL and Scouting Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_analytics_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: football_analytics_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Python syntax
        run: python -m compileall -q src scripts tests

      - name: Install Python dependencies
        run: python -m pip install requests python-dotenv psycopg2-binary

      - name: Test API pagination
        run: python -m unittest discover -s tests/python -p 'test_fetch_matches.py' -v

      - name: Test pipeline status handling
        run: python -m unittest discover -s tests/python -p 'test_pipeline_status.py' -v

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize database
        run: python -m scripts.init_database

      - name: Load synthetic scouting fixtures
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -f sql/tests/fixtures/seed_scouting.sql

      - name: Run data quality and scouting tests
        env:
          RUN_SCOUTING_TESTS: "1"
        run: python -m src.run_quality_checks
